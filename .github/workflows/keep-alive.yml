# ============================================================
# .github/workflows/keep-alive.yml
# Mantenimiento automático — Moto Partes Serpico S.A.S
#
# Cada 3 días este workflow:
#   1. Consulta Supabase (tablas banners y products) → evita que el
#      proyecto gratuito entre en pausa por inactividad.
#   2. Consulta la página publicada en GitHub Pages → verifica que
#      el despliegue siga en línea.
#   3. Registra un "latido" (commit de .keepalive) → GitHub desactiva
#      los workflows programados tras 60 días sin actividad en el
#      repositorio; este commit mantiene todo activo y además fuerza
#      una reconstrucción del sitio.
#
# SETUP (una sola vez):
#   GitHub → repositorio → Settings → Secrets and variables → Actions
#     - SUPABASE_URL      = https://TU_PROYECTO.supabase.co
#     - SUPABASE_ANON_KEY = tu clave anon/public
#
# Sin esos secrets el workflow igual funciona: omite el ping a Supabase
# y mantiene el latido del repositorio.
# ============================================================

name: 🔄 Keep-Alive (Supabase + GitHub Pages)

on:
  schedule:
    # Cada 3 días a las 12:00 UTC (7:00 a. m. en Colombia)
    - cron: '0 12 */3 * *'

  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del ping manual'
        required: false
        default: 'Verificación manual'

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

env:
  PAGES_URL: https://estebancefit1500-lab.github.io/MOTO-PARTES-Y-ACESORIOS-SERPICO-S.A.S/

jobs:
  keep-alive:
    name: Ping Supabase + Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 📅 Información de la ejecución
        run: |
          echo "============================================"
          echo "  Keep-Alive — Serpico Motos"
          echo "  Fecha: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Disparador: ${{ github.event_name }}"
          echo "============================================"

      - name: 🗄️ Ping a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY. Se omite el ping a Supabase."
            exit 0
          fi

          ok=0
          for table in banners products; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Accept: application/json" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1")
            echo "Tabla '$table' → HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              ok=$((ok+1))
            fi
          done

          if [ "$ok" -eq 2 ]; then
            echo "✅ Supabase está activo y respondiendo."
          else
            echo "::error::Supabase no respondió correctamente ($ok/2 tablas)."
            exit 1
          fi

      - name: 🌐 Ping a GitHub Pages
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" "$PAGES_URL")
          echo "Sitio publicado → HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "✅ GitHub Pages responde correctamente."
          else
            echo "::warning::El sitio no respondió ($code). Si acabas de activar Pages, es normal."
          fi

      - name: ❤️ Latido del repositorio
        run: |
          echo "Último latido: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "Sin cambios que registrar."
          else
            git commit -m "chore(keep-alive): latido $(date -u '+%Y-%m-%d')"
            git push
            echo "✅ Latido registrado. Repositorio y despliegue activos."
          fi
