<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Kit de arrastre">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#E4E6EA"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4F57"/>
      <stop offset="1" stop-color="#16181C"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8343F"/>
      <stop offset="1" stop-color="#B01620"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="190" r="150" fill="#16181C" opacity="0.035"/>

  <!-- Corona / catalina -->
  <g transform="translate(200 185)">
    <circle r="104" fill="none" stroke="url(#metal)" stroke-width="16" stroke-dasharray="12 11"/>
    <circle r="86" fill="url(#metal)"/>
    <circle r="64" fill="#EDEFF2"/>
    <circle r="58" fill="url(#metal)"/>
    <circle r="42" fill="url(#red)"/>
    <circle r="20" fill="#EDEFF2"/>
    <g fill="#EDEFF2">
      <circle cx="0" cy="-50" r="6"/>
      <circle cx="47" cy="-17" r="6"/>
      <circle cx="29" cy="41" r="6"/>
      <circle cx="-29" cy="41" r="6"/>
      <circle cx="-47" cy="-17" r="6"/>
    </g>
  </g>

  <!-- Cadena -->
  <path d="M 62 300 Q 200 372 338 300" fill="none" stroke="#16181C" stroke-width="15"
        stroke-linecap="round" stroke-dasharray="20 12"/>
  <path d="M 62 300 Q 200 372 338 300" fill="none" stroke="#D6202C" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="1 31" opacity="0.85"/>

  <!-- Brillo -->
  <ellipse cx="120" cy="80" rx="70" ry="34" fill="#FFFFFF" opacity="0.5"/>
</svg>
