<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Pastillas de freno">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#E4E6EA"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A606A"/>
      <stop offset="1" stop-color="#2A2E35"/>
    </linearGradient>
    <linearGradient id="padred" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8343F"/>
      <stop offset="1" stop-color="#B01620"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg2)"/>
  <circle cx="200" cy="200" r="152" fill="#16181C" opacity="0.035"/>

  <!-- Pastilla superior -->
  <g transform="translate(200 168) rotate(-8)">
    <rect x="-112" y="-70" width="224" height="52" rx="18" fill="url(#padred)"/>
    <rect x="-112" y="-70" width="224" height="20" rx="10" fill="#FFFFFF" opacity="0.18"/>
    <path d="M -100 -16 h200 v30 a34 34 0 0 1 -34 34 h-132 a34 34 0 0 1 -34 -34 z" fill="url(#steel)"/>
    <rect x="-96" y="4" width="192" height="10" rx="5" fill="#16181C" opacity="0.35"/>
  </g>

  <!-- Pastilla inferior -->
  <g transform="translate(200 268) rotate(-8)">
    <rect x="-112" y="-70" width="224" height="52" rx="18" fill="url(#padred)"/>
    <rect x="-112" y="-70" width="224" height="20" rx="10" fill="#FFFFFF" opacity="0.18"/>
    <path d="M -100 -16 h200 v30 a34 34 0 0 1 -34 34 h-132 a34 34 0 0 1 -34 -34 z" fill="url(#steel)"/>
    <rect x="-96" y="4" width="192" height="10" rx="5" fill="#16181C" opacity="0.35"/>
  </g>

  <!-- Resorte -->
  <path d="M 96 118 q 22 26 44 0 q 22 -26 44 0 q 22 26 44 0 q 22 -26 44 0"
        fill="none" stroke="#8B9198" stroke-width="7" stroke-linecap="round"/>

  <ellipse cx="120" cy="70" rx="72" ry="32" fill="#FFFFFF" opacity="0.45"/>
</svg>
